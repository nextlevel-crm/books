<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intelligent Successful Wise · Dharmendra Satapathy</title>
<meta name="description" content="Intelligent Successful Wise: clarity about what deserves your life. A small illustrated book by Dharmendra Satapathy. Read it online or download the PDF.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nlehni.com/wise/">
<meta property="og:title" content="Intelligent Successful Wise">
<meta property="og:description" content="Clarity about what deserves your life. A small illustrated book by Dharmendra Satapathy.">
<meta property="og:image" content="https://nlehni.com/wise/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap">
<style>
/* The book lying open on a dark sage desk: one quiet bar above, one below. Single dark look, taken from the book's cover. */
:root{
  --desk:#18221D; --desk-2:#24342B; --ink:#F6ECD8; --muted:#AEB8A8;
  --line:rgba(246,236,216,.16); --gold:#CFB37A; --clay:#B9612A;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Lato',system-ui,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 40%,var(--desk-2) 0%,var(--desk) 70%);background-color:var(--desk);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.topbar{padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;margin-right:auto}
.brand b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand b i{font-style:normal;color:var(--gold)}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.tb{font-size:13px;font-weight:700;color:var(--ink);border:1px solid var(--line);padding:8px 12px;text-decoration:none;white-space:nowrap}
.tb.pdf{background:var(--gold);border-color:var(--gold);color:var(--desk)}
.tb:hover{border-color:var(--ink)}
.tb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:980px){.ladder{display:none}}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
#holder{margin:0 auto;max-width:100%}
#book{width:100%}
.pg{background:#F6ECD8;overflow:hidden}
.pg img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;max-width:none}
.side{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(243,238,228,.06);color:var(--ink);font-size:26px;cursor:pointer;z-index:5}
.side:hover{background:rgba(243,238,228,.14)}
.side.l{left:max(8px,env(safe-area-inset-left,0px))}.side.r{right:max(8px,env(safe-area-inset-right,0px))}
.side:disabled{opacity:.25;cursor:default}
.bar{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar button,.bar a{font-family:var(--body);font-size:13px;font-weight:700;color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 12px;cursor:pointer;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.bar button:hover,.bar a:hover{border-color:var(--gold)}
.bar button:disabled{opacity:.35;cursor:default}
.bar :focus-visible,.side:focus-visible,.thumbs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;min-width:84px;text-align:center;color:var(--muted)}
.count b{color:var(--ink)}
.thumbs{display:flex;gap:10px;justify-content:flex-start;padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;background:none;cursor:pointer;flex:0 0 auto;color:var(--muted);font-family:var(--body)}
.thumbs img{width:54px;height:72px;object-fit:cover;display:block}
.thumbs button.on{border-color:var(--gold)}
.thumbs span{display:block;font-size:10px;text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:2px;left:0;right:0;margin:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;transition:opacity .6s}
@media (max-width:640px){.brand span,.ladder{display:none}.side{display:none}.bar button,.bar a{padding:8px 10px}
  .brand b{font-size:13px;letter-spacing:.04em;white-space:normal;line-height:1.15}}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
#zoom{position:fixed;inset:0;z-index:50;background:#111814;display:flex;flex-direction:column}
#zoom .zbar{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
#zoom .zbar button{font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 13px;min-height:38px;cursor:pointer}
#zoom .zbar button:hover{border-color:var(--gold)}
#zoom .zbar button:disabled{opacity:.35;cursor:default}
#zoom .zbar :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#zoom .zlab{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--muted);min-width:150px;text-align:center}
#zoom .zst{flex:1;min-height:0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;cursor:grab}
#zoom .zst.drag{cursor:grabbing}
#zoom .zst img{display:inline-block;max-width:none;height:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
</style>
</head>
<body>


<div class="app">
  <header class="topbar"><div class="topbar-in">
    <div class="brand"><b>Intelligent Successful <i>Wise</i></b><span>Dharmendra Satapathy · 36 pages</span></div>
    <span class="ladder">Capability → Wisdom → Clarity</span>
    <a class="tb" href="../">All books</a>
    <a class="tb pdf" href="./intelligent-successful-wise.pdf" download="Intelligent-Successful-Wise.pdf">Download PDF</a>
  </div></header>
  <main class="stage" id="stage">
    <button class="side l" id="prevSide" type="button" aria-label="Previous page">‹</button>
    <div id="holder"><div id="book" aria-label="Intelligent Successful Wise, page-turning view"></div></div>
    <button class="side r" id="nextSide" type="button" aria-label="Next page">›</button>
    <p class="hint" id="hint">Drag a corner, swipe, or use the arrow keys to turn pages</p>
  </main>
  <nav class="thumbs" id="thumbs" hidden aria-label="Pages"></nav>
  <footer class="bar">
    <button type="button" id="first" aria-label="First page">⏮</button>
    <button type="button" id="prev">‹ Prev</button>
    <span class="count" id="count" aria-live="polite"><b>1</b> / 36</span>
    <button type="button" id="next">Next ›</button>
    <button type="button" id="pagesBtn" aria-expanded="false">Pages</button>
    <button type="button" id="zoomBtn" title="Read one page large (or double-click a page)">Zoom</button>
    <button type="button" id="fs">Full screen</button>
    <button type="button" id="copy" aria-live="polite">Copy link</button>
  </footer>
</div>

<script src="../assets/page-flip-2.0.7.js"></script>
<script>
(function(){
  var ALT = [
    "Cover: an old man and a young boy talking on a shaded veranda. Intelligent Successful Wise: Clarity About What Deserves Your Life, by Dharmendra Satapathy.",
    "Title page: Intelligent Successful Wise. Clarity About What Deserves Your Life. Dharmendra Satapathy.",
    "Prologue, The Man Who Had Time, with an illustration of an empty cane chair on a veranda. A friend's wealthy uncle who always had time to talk.",
    "Prologue, continued: what had this man understood that so many intelligent people overlook?",
    "Chapter 1, The Intelligence We Applaud, with an illustration of an examination paper marked with a gold star.",
    "Chapter 1, continued, with Figure 1, the founder's curve: revenue rises over the years while the hours the founder can call their own fall.",
    "Chapter 1, continued: intelligence can improve an answer long after wisdom would have changed the question.",
    "Chapter 2, Four Ways to Use a Life, with an illustration of an open pocket compass.",
    "Chapter 2, continued, with Figure 2: a grid of specialist capability against wisdom and clarity. The Drifter, the Accomplished Captive, the Wise Orchestrator and the Conscious Achiever.",
    "Chapter 2, continued: the four quadrants explained, and the model as a mirror for a decision.",
    "Chapter 3, Living Out of a Suitcase, with an illustration of a half-packed suitcase beside an invitation.",
    "Chapter 3, continued: which journeys were worth making, and the evenings we wanted back.",
    "Chapter 3, continued: the practical test is whether we can choose which places deserve us.",
    "Chapter 4, The Courage to Employ Someone Better, with an illustration of one hand passing a key into another.",
    "Chapter 4, continued: the salaries have been delegated; the authority has stayed where it was.",
    "Chapter 4, continued: the expensive habit of remaining the cleverest person in every conversation.",
    "Chapter 5, What a Limitation Can Teach, with an illustration of a speaker at a lectern holding a single card.",
    "Chapter 5, continued: does my ability belong in this task today, or am I here because I have always been here?",
    "Chapter 6, A Balance Sheet With Missing Entries, with an illustration of an open ledger and a fountain pen.",
    "Chapter 6, continued, with Figure 3: entries we count, all ticked, beside missing entries left blank: health, friendships, family, control over an ordinary Tuesday.",
    "Chapter 6, continued: wisdom brings the missing entries into view.",
    "Chapter 7, The Ambitions We Never Chose, with an illustration of a ladder leaning against someone else's wall.",
    "Chapter 7, continued: a borrowed ambition can consume an original life.",
    "Chapter 8, The Question Beneath the Answer, with an illustration of nested wooden boxes.",
    "Chapter 8, continued, with Figure 4: the why ladder from doubling the firm up to the freedom to choose how to spend time.",
    "Chapter 8, continued: the value of a difficult question lies in the decision it makes possible.",
    "Chapter 9, What Did My Life Make Possible, with an illustration of two hands planting a sapling.",
    "Chapter 9, continued: what became possible because I was here?",
    "Chapter 10, Clarity Has to Reach the Calendar, with an illustration of a weekly planner with Tuesday circled.",
    "Chapter 10, continued, with Figure 5: a grid of examined priorities against follow-through. Unanchored, Efficient But Unexamined, Knowing But Postponing and Living With Clarity.",
    "Chapter 10, continued: an examined life still has to be lived on an ordinary Tuesday.",
    "Chapter 11, The Man Who Had Time Revisited, with the illustration of the empty cane chair.",
    "Chapter 11, continued: the uncle had kept the responsibility for choosing his life.",
    "Epilogue, What Deserves the Next Hour, with an illustration of an hourglass.",
    "Epilogue, continued: have I become good at living, or only good at achieving?",
    "Source note and reference."
  ];
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  var SRC = ALT.map(function(_, i){ return './p' + (i + 1) + '.jpg'; });
  var THUMB = ALT.map(function(_, i){ return './t' + (i + 1) + '.jpg'; });
  var N = ALT.length, W = 1200, H = 1600, cur = 0, flip = null, flat = false;
  var $ = function(id){ return document.getElementById(id); };
  var book = $('book'), stage = $('stage'), holder = $('holder');

  var pages = ALT.map(function(a, i){
    var d = document.createElement('div'); d.className = 'pg';
    if (i === 0 || i === N - 1) d.setAttribute('data-density', 'hard');
    var im = document.createElement('img'); im.src = SRC[i]; im.alt = a; im.loading = i < 4 ? 'eager' : 'lazy';
    d.appendChild(im); book.appendChild(d); return d;
  });

  ALT.forEach(function(a, i){
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Go to page ' + (i + 1));
    b.innerHTML = '<img src="' + THUMB[i] + '" alt="" loading="lazy"><span>' + (i + 1) + '</span>';
    b.addEventListener('click', function(){ go(i); });
    $('thumbs').appendChild(b);
  });

  var landscape = function(){ return flip && flip.getOrientation() === 'landscape'; };
  function label(i){
    if (!landscape() || i === 0 || i === N - 1) return '<b>' + (i + 1) + '</b> / ' + N;
    var a = i % 2 ? i : i - 1; return '<b>' + (a + 1) + '–' + (a + 2) + '</b> / ' + N;
  }
  function update(i){
    cur = i; $('count').innerHTML = label(i);
    $('prev').disabled = $('first').disabled = $('prevSide').disabled = i === 0;
    $('next').disabled = $('nextSide').disabled = i >= N - 1;
    var pair = landscape() && i > 0 && i < N - 1 ? (i % 2 ? i + 1 : i - 1) : -1;
    [].forEach.call($('thumbs').children, function(t, k){ t.classList.toggle('on', k === i || k === pair); });
    try { history.replaceState(null, '', '#p' + (i + 1)); } catch(e){}
  }
  function go(i){ if (flip) flip.flip(i); else if (flat) showFlat(i); }
  function next(){ if (flip) flip.flipNext(); else if (flat) showFlat(Math.min(N - 1, cur + 1)); }
  function prev(){ if (flip) flip.flipPrev(); else if (flat) showFlat(Math.max(0, cur - 1)); }

  // two pages side by side when the stage is wide enough, one otherwise
  function fit(){
    var sw = stage.clientWidth - 32 - (innerWidth > 640 ? 120 : 0), sh = stage.clientHeight - 28;
    var wide = sw / sh > (W / H) * 1.35;
    var pageH = Math.min(sh, (wide ? sw / 2 : sw) * H / W);
    return { w: Math.floor(pageH * W / H), h: Math.floor(pageH), wide: wide };
  }
  function sizeBook(){ var s = fit(); holder.style.width = (s.wide ? s.w * 2 : s.w) + 'px'; }
  function startAt(){ var m = /^#p(\d+)$/.exec(location.hash); return m ? Math.min(N, Math.max(1, +m[1])) - 1 : 0; }

  function start(){
    var s = fit();
    if (!window.St || !St.PageFlip) return startFlat();
    flip = new St.PageFlip(book, {
      width: s.w, height: s.h, size: 'stretch',
      minWidth: 260, maxWidth: 2000, minHeight: 200, maxHeight: 4000,
      showCover: true, usePortrait: true, mobileScrollSupport: false,
      maxShadowOpacity: .45, flippingTime: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 750, autoSize: true
    });
    sizeBook();
    flip.loadFromHTML(pages);
    flip.on('flip', function(e){ update(e.data); });
    flip.on('changeOrientation', function(){ update(flip.getCurrentPageIndex()); });
    var at = startAt();
    if (at) flip.turnToPage(at);
    update(at);
  }
  function refit(){ if (flip) { sizeBook(); try { flip.update(); } catch(e){} } else if (flat) showFlat(cur); }
  addEventListener('resize', refit);

  // plain page viewer, if the page-turn script cannot load
  function startFlat(){ flat = true; showFlat(startAt()); }
  function showFlat(i){
    var s = fit(); book.innerHTML = '';
    var img = new Image(); img.src = SRC[i]; img.alt = ALT[i];
    img.style.cssText = 'display:block;margin:0 auto;max-width:100%;height:' + s.h + 'px;width:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)';
    book.appendChild(img); update(i);
  }

  $('next').onclick = $('nextSide').onclick = next;
  $('prev').onclick = $('prevSide').onclick = prev;
  $('first').onclick = function(){ if (flip) { flip.turnToPage(0); update(0); } else if (flat) showFlat(0); };
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault(); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
  });
  $('pagesBtn').onclick = function(){
    var t = $('thumbs'); t.hidden = !t.hidden; this.setAttribute('aria-expanded', String(!t.hidden));
    setTimeout(refit, 0);
  };
  $('fs').onclick = function(){
    var d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement) d.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(function(){ $('fs').hidden = true; });
      else $('fs').hidden = true;
    } catch(e){ $('fs').hidden = true; }
  };
  if (!document.documentElement.requestFullscreen) $('fs').hidden = true;
  document.addEventListener('fullscreenchange', function(){
    $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; setTimeout(refit, 120);
  });
  setTimeout(function(){ $('hint').style.opacity = 0; }, 6000);

  // Copy the clean link (no page anchor), so what gets shared is always the whole book
  var LINK = 'https://nlehni.com/wise';
  $('copy').onclick = function(){
    var btn = this, done = function(t){ btn.textContent = t; setTimeout(function(){ btn.textContent = 'Copy link'; }, 2000); };
    var fallback = function(){
      var ta = document.createElement('textarea'); ta.value = LINK; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta); done(ok ? 'Link copied' : LINK);
    };
    try { navigator.clipboard.writeText(LINK).then(function(){ done('Link copied'); }, fallback); } catch(e){ fallback(); }
  };

  // Zoom reader: one page at a time, + / − / Fit, drag or scroll to move around.
  (function(){
    var z = document.createElement('div'); z.id = 'zoom'; z.hidden = true;
    z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', 'Zoomed page');
    z.innerHTML = '<div class="zbar"><button type="button" id="zprev" aria-label="Previous page">‹</button><span class="zlab" id="zlab"></span>' +
      '<button type="button" id="znext" aria-label="Next page">›</button><button type="button" id="zout" aria-label="Zoom out">−</button>' +
      '<button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zfit">Fit width</button><button type="button" id="zclose">Close ✕</button></div>' +
      '<div class="zst" id="zst"><img id="zimg" alt=""></div>';
    document.body.appendChild(z);
    var st = $('zst'), im = $('zimg'), zi = 0, scale = 1, STEPS = [0.75, 1, 1.35, 1.75, 2.25, 3];
    function fitW(){ return Math.min(st.clientWidth - 32, 900); }
    function paintZ(){
      im.style.width = Math.round(fitW() * scale) + 'px';
      $('zlab').textContent = 'Page ' + (zi + 1) + ' / ' + N + ' · ' + Math.round(scale * 100) + '%';
      $('zprev').disabled = zi === 0; $('znext').disabled = zi >= N - 1;
      $('zout').disabled = scale <= STEPS[0]; $('zin').disabled = scale >= STEPS[STEPS.length - 1];
    }
    function showZ(i){ zi = Math.max(0, Math.min(N - 1, i)); im.src = SRC[zi]; im.alt = ALT[zi]; st.scrollTop = 0; paintZ(); }
    function openZ(i){ z.hidden = false; scale = 1; showZ(i); $('zclose').focus(); }
    function closeZ(){ z.hidden = true; if (flip && zi !== cur) { try { flip.turnToPage(zi); update(zi); } catch(e){} } else if (flat) showFlat(zi); }
    function zoomBy(d){
      var k = STEPS.indexOf(scale); if (k < 0) k = 1; k = Math.max(0, Math.min(STEPS.length - 1, k + d));
      var cx = (st.scrollLeft + st.clientWidth / 2) / (im.offsetWidth || 1), cy = (st.scrollTop + st.clientHeight / 2) / (im.offsetHeight || 1);
      scale = STEPS[k]; paintZ();
      st.scrollLeft = cx * im.offsetWidth - st.clientWidth / 2; st.scrollTop = cy * im.offsetHeight - st.clientHeight / 2;
    }
    $('zprev').onclick = function(){ showZ(zi - 1); };
    $('znext').onclick = function(){ showZ(zi + 1); };
    $('zin').onclick = function(){ zoomBy(1); };
    $('zout').onclick = function(){ zoomBy(-1); };
    $('zfit').onclick = function(){ scale = 1; paintZ(); };
    $('zclose').onclick = closeZ;
    $('zoomBtn').onclick = function(){ openZ(cur); };
    book.addEventListener('dblclick', function(e){
      var t = e.target.closest && e.target.closest('.pg'); var i = t ? pages.indexOf(t) : -1;
      openZ(i >= 0 ? i : cur);
    });
    addEventListener('keydown', function(e){
      if (z.hidden) return;
      var k = e.key, used = true;
      if (k === 'Escape') closeZ(); else if (k === 'ArrowRight' && scale <= 1) showZ(zi + 1);
      else if (k === 'ArrowLeft' && scale <= 1) showZ(zi - 1);
      else if (k === '+' || k === '=') zoomBy(1); else if (k === '-') zoomBy(-1); else used = false;
      if (used) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
    st.addEventListener('wheel', function(e){ if (e.ctrlKey) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1 : -1); } }, { passive: false });
    var dx = 0, dy = 0, down = false;
    st.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'mouse') return; down = true; dx = e.clientX; dy = e.clientY; st.classList.add('drag'); });
    addEventListener('pointermove', function(e){ if (!down) return; st.scrollLeft -= e.clientX - dx; st.scrollTop -= e.clientY - dy; dx = e.clientX; dy = e.clientY; });
    addEventListener('pointerup', function(){ down = false; st.classList.remove('drag'); });
    addEventListener('resize', function(){ if (!z.hidden) paintZ(); });
  })();

  // open the book at once: the pages have a fixed size, so nothing needs to wait for the pictures to download
  start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  addEventListener('load', refit);
})();
</script>

</body>
</html>
